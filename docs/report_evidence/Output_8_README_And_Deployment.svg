      <rect x="0" y="0" width="200" height="42" rx="6" fill="#1E293B" stroke="#059669" stroke-width="1" />
      <circle cx="16" cy="21" r="5" fill="#10B981" />
      <text x="30" y="18" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700">VERCEL FRONTEND</text>
      <text x="30" y="32" fill="#34D399" font-family="'Inter', sans-serif" font-size="9.5">Production · READY</text>

      <!-- Badge 2: Render -->
      <rect x="220" y="0" width="200" height="42" rx="6" fill="#1E293B" stroke="#059669" stroke-width="1" />
      <circle cx="236" cy="21" r="5" fill="#10B981" />
      <text x="250" y="18" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700">RENDER BACKEND API</text>
      <text x="250" y="32" fill="#34D399" font-family="'Inter', sans-serif" font-size="9.5">Web Service · LIVE</text>
    </g>

    <!-- URLs and Endpoints -->
    <g transform="translate(16, 110)">
      <text x="0" y="14" fill="#38BDF8" font-size="11" font-weight="700"># Production Endpoints</text>

      <!-- URL 1: UI -->
      <rect x="0" y="24" width="423" height="60" rx="6" fill="#111827" stroke="#1F2937" />
      <text x="12" y="44" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Client Web Application (Single Page App):</text>
      <text x="12" y="66" fill="#60A5FA" font-size="10.5">https://java-ev-battery-project.vercel.app</text>

      <!-- URL 2: API -->
      <rect x="0" y="96" width="423" height="60" rx="6" fill="#111827" stroke="#1F2937" />
      <text x="12" y="116" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Spring Boot REST Microservice API:</text>
      <text x="12" y="138" fill="#60A5FA" font-size="10.5">https://java-ev-battery-project.onrender.com</text>

      <!-- URL 3: Swagger -->
      <rect x="0" y="168" width="423" height="60" rx="6" fill="#111827" stroke="#1F2937" />
      <text x="12" y="188" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Interactive Swagger / OpenAPI 3.0 Documentation:</text>
      <text x="12" y="210" fill="#60A5FA" font-size="9.5">https://...onrender.com/swagger-ui/index.html</text>

      <!-- Architecture Summary Box -->
      <rect x="0" y="240" width="423" height="135" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="14" y="262" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Production Infrastructure Summary:</text>
      <text x="14" y="284" fill="#94A3B8" font-size="10">• Architecture: 3-Tier Distributed Microservices</text>
      <text x="14" y="304" fill="#94A3B8" font-size="10">• Security: Stateless JWT Filter + BCrypt (10 rounds)</text>
      <text x="14" y="324" fill="#94A3B8" font-size="10">• Database: PostgreSQL Relational Cloud Storage</text>
      <text x="14" y="344" fill="#94A3B8" font-size="10">• Intelligence: Real-Time Multi-Factor Risk Scorer</text>
      <text x="14" y="364" fill="#34D399" font-size="10">• Deployment: Automated CI/CD (GitHub -&gt; Vercel &amp; Render)</text>

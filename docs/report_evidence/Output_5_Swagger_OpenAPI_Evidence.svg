<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background-color: #0F172A; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Header Bar -->
  <g transform="translate(30, 20)">
    <rect width="940" height="40" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="20" y="25" fill="#F1F5F9" font-size="13" font-weight="700" letter-spacing="1">OUTPUT 5: SWAGGER / OPENAPI 3.0 API DOCUMENTATION &amp; TEST EVIDENCE</text>
    <rect x="790" y="9" width="130" height="22" rx="3" fill="#1F2937" stroke="#374151" />
    <circle cx="804" cy="20" r="3.5" fill="#22C55E" />
    <text x="814" y="24" fill="#CBD5E1" font-size="10" font-weight="600">SPRINGDOC 2.6.0</text>
  </g>

  <!-- Swagger UI Browser Window -->
  <g transform="translate(30, 75)">
    <rect width="940" height="520" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
    <!-- Browser Top Bar -->
    <rect x="0" y="0" width="940" height="36" rx="8" fill="#0F172A" />
    <rect x="0" y="28" width="940" height="8" fill="#0F172A" />
    <line x1="0" y1="36" x2="940" y2="36" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="18" r="4.5" fill="#EF4444" />
    <circle cx="34" cy="18" r="4.5" fill="#F59E0B" />
    <circle cx="50" cy="18" r="4.5" fill="#10B981" />
    
    <!-- Address Bar -->
    <rect x="80" y="8" width="550" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="92" y="22" fill="#94A3B8" font-family="monospace" font-size="10.5">https://java-ev-battery-project.onrender.com/swagger-ui/index.html</text>

    <!-- Swagger UI Top Branding -->
    <g transform="translate(25, 52)">
      <text x="0" y="24" fill="#F1F5F9" font-size="19" font-weight="700">THERMOCORE - EV Battery Thermal Management API</text>
      <rect x="525" y="8" width="52" height="20" rx="3" fill="#3B82F6" />
      <text x="551" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">v3.0.0</text>
      
      <rect x="585" y="8" width="55" height="20" rx="3" fill="#1F2937" stroke="#374151" />
      <text x="612" y="22" fill="#94A3B8" font-size="10" font-weight="600" text-anchor="middle">OAS 3.0</text>

      <text x="0" y="44" fill="#94A3B8" font-size="11">
        Interactive OpenAPI contract and live execution sandbox for EV Battery Thermal Management (KJS-CES-02).
      </text>
      <text x="0" y="60" fill="#60A5FA" font-size="10.5">[/v3/api-docs] • Terms of Service • Educational License</text>
    </g>

    <!-- Prominent Authorize Button -->
    <g transform="translate(770, 70)">
      <rect width="145" height="34" rx="4" fill="#047857" stroke="#10B981" stroke-width="1.2" />
      <!-- Padlock icon -->
      <path d="M 22 22 L 22 17 A 5 5 0 0 1 32 17 L 32 22 M 19 22 L 35 22 L 35 30 L 19 30 Z" stroke="#FFFFFF" stroke-width="1.6" fill="none" />
      <text x="44" y="22" fill="#FFFFFF" font-size="12" font-weight="700">Authorize</text>
    </g>

    <!-- Authorize Modal Overlay (Simulated Floating Dialog) -->
    <g transform="translate(480, 125)">
      <rect width="435" height="200" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
      <!-- Modal Header -->
      <rect x="0" y="0" width="435" height="32" rx="6" fill="#1E293B" />
      <rect x="0" y="24" width="435" height="8" fill="#1E293B" />
      <text x="16" y="21" fill="#F1F5F9" font-size="12" font-weight="700">Available authorizations</text>
      
      <!-- Content -->
      <text x="16" y="52" fill="#60A5FA" font-size="11.5" font-weight="600">Bearer Authentication (http, Bearer)</text>
      <text x="16" y="70" fill="#94A3B8" font-size="10">Enter JWT Bearer token obtained from POST /api/auth/login.</text>
      
      <text x="16" y="100" fill="#CBD5E1" font-size="10.5" font-weight="500">Value:</text>
      <rect x="60" y="86" width="355" height="24" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="70" y="102" fill="#34D399" font-family="monospace" font-size="10">Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOi...</text>

      <!-- Buttons -->
      <rect x="250" y="156" width="75" height="28" rx="4" fill="#047857" stroke="#10B981" />
      <text x="287" y="174" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">Authorize</text>

      <rect x="335" y="156" width="75" height="28" rx="4" fill="#1E293B" stroke="#334155" />
      <text x="372" y="174" fill="#CBD5E1" font-size="11" font-weight="500" text-anchor="middle">Close</text>
    </g>

    <!-- Documented Endpoint Rows (Left side of Swagger UI) -->
    <g transform="translate(25, 125)">
      <!-- Tag 1: auth-controller -->
      <rect x="0" y="0" width="435" height="34" rx="4" fill="#1E3A8A" stroke="#2563A6" stroke-width="1" />
      <rect x="8" y="7" width="52" height="20" rx="3" fill="#2563A6" />
      <text x="34" y="21" fill="#FFFFFF" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">POST</text>
      <text x="70" y="21" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="600">/api/auth/login</text>
      <text x="360" y="21" fill="#93C5FD" font-size="10">Authenticate</text>

      <!-- Tag 2: thermal-controller (Protected) -->
      <rect x="0" y="42" width="435" height="34" rx="4" fill="#1E3A8A" stroke="#2563A6" stroke-width="1" />
      <rect x="8" y="49" width="52" height="20" rx="3" fill="#2563A6" />
      <text x="34" y="63" fill="#FFFFFF" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">POST</text>
      <text x="70" y="63" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="600">/api/thermal/evaluate</text>
      <!-- Padlock -->
      <path d="M 390 63 L 390 59 A 3 3 0 0 1 396 59 L 396 63 M 388 63 L 398 63 L 398 69 L 388 69 Z" stroke="#34D399" stroke-width="1.3" fill="none" />
      <text x="325" y="63" fill="#4ADE80" font-size="9.5" font-weight="600">AI EVAL</text>

      <!-- Tag 3: battery-controller (Protected) -->
      <rect x="0" y="84" width="435" height="34" rx="4" fill="#1E3A8A" stroke="#2563A6" stroke-width="1" />
      <rect x="8" y="91" width="52" height="20" rx="3" fill="#2563A6" />
      <text x="34" y="105" fill="#FFFFFF" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">POST</text>
      <text x="70" y="105" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="600">/api/batteries</text>
      <path d="M 390 105 L 390 101 A 3 3 0 0 1 396 101 L 396 105 M 388 105 L 398 105 L 398 111 L 388 111 Z" stroke="#34D399" stroke-width="1.3" fill="none" />
      <text x="315" y="105" fill="#4ADE80" font-size="9.5" font-weight="600">CREATE PACK</text>

      <!-- Tag 4: sensor-controller -->
      <rect x="0" y="126" width="435" height="34" rx="4" fill="#064E3B" stroke="#059669" stroke-width="1" />
      <rect x="8" y="133" width="52" height="20" rx="3" fill="#059669" />
      <text x="34" y="147" fill="#FFFFFF" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">GET</text>
      <text x="70" y="147" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="600">/api/sensors/cells/{id}</text>
      <text x="330" y="147" fill="#86EFAC" font-size="9.5">24 Cells</text>

      <!-- Tag 5: alert-controller (Protected) -->
      <rect x="0" y="168" width="435" height="34" rx="4" fill="#78350F" stroke="#D97706" stroke-width="1" />
      <rect x="8" y="175" width="52" height="20" rx="3" fill="#D97706" />
      <text x="34" y="189" fill="#FFFFFF" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">PUT</text>
      <text x="70" y="189" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="600">/api/alerts/{id}/resolve</text>
      <path d="M 390 189 L 390 185 A 3 3 0 0 1 396 185 L 396 189 M 388 189 L 398 189 L 398 195 L 388 195 Z" stroke="#34D399" stroke-width="1.3" fill="none" />
      <text x="325" y="189" fill="#4ADE80" font-size="9.5" font-weight="600">RESOLVE</text>
    </g>

    <!-- Bottom Status Banner -->
    <g transform="translate(25, 345)">
      <rect width="890" height="32" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="16" r="4" fill="#10B981" />
      <text x="34" y="20" fill="#CBD5E1" font-size="10.5" font-weight="600">
        All 14 endpoints scanned and documented. Tested directly via Swagger UI "Try it out" console with active Bearer Token.
      </text>
    </g>
  </g>
</svg>

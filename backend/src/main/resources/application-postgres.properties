# PostgreSQL Configuration (Supabase Cloud PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.nrabwtcebghjnctauntp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Sarvesh@2004}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings for Cloud Containers
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
